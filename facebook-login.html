<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Login</title>

    <link rel="stylesheet" href="assets/css/facebook-login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <!-- LEFT SECTION -->

    <div class="left-section">

        <!-- Facebook Logo -->

        <img src="assets/images/FB logo.webp"
             alt="Facebook Logo"
             class="facebook-logo">

        <!-- Illustration -->

        <img src="assets/images/FB login image.webp"
             alt="Facebook Illustration"
             class="left-image">

        <!-- Heading -->

        <div class="heading">

            <h1>Explore</h1>
            <h1>the</h1>
            <h1>things</h1>
            <h1 style="color: blue;">you love.</h1>

        </div>

    </div>

    <!-- RIGHT SECTION -->

    <div class="right-section">

        <div class="login-box">

            <h2>Log in to Facebook</h2>

            <form id="loginForm">

                <input
                    type="text"
                    placeholder="Email address or mobile number"
                    required>

                <input
                    type="password"
                    placeholder="Password"
                    required>

                <button type="submit" class="login-btn">
                    Log in
                </button>

                <a href="#" class="forgot">
                    Forgotten password?
                </a>

                <button type="button" class="create-btn">
                    Create new account
                </button>

            </form>

            <div class="meta">

                <img src="assets/images/meta logo.jpg"
                     alt="Meta Logo"
                     class="meta-logo">

                <span>Meta</span>

            </div>

        </div>

    </div>

</div>

<script src="assets/js/facebook-login.js"></script>

</body>
</html>
